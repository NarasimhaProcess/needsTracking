name: Supabase Schema Migration

on:
  workflow_dispatch:

jobs:
  migrate-schema:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP SUPABASE CLI
      # ==========================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # ==========================================================
      # 3. INSTALL POSTGRESQL CLIENT
      # ==========================================================
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ==========================================================
      # 4. SHOW CONFIGURATION
      # ==========================================================
      - name: Show Configuration
        env:
          SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          echo "=========================================="
          echo "SUPABASE SCHEMA MIGRATION"
          echo "=========================================="
          echo "SOURCE : $SOURCE_PROJECT_REF"
          echo "TARGET : $TARGET_PROJECT_REF"
          echo "=========================================="

      # ==========================================================
      # 5. LOGIN TO SOURCE
      # ==========================================================
      - name: Login to SOURCE
        env:
          SOURCE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SOURCE_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "LOGIN SOURCE"
          echo "=========================================="

          supabase login \
            --token "$SOURCE_SUPABASE_ACCESS_TOKEN"

      # ==========================================================
      # 6. SET SOURCE DATABASE URL
      #
      # IMPORTANT:
      # Use Supabase Transaction Pooler URL.
      # Do NOT use db.<project>.supabase.co:5432
      # because GitHub Actions may not have IPv6 connectivity.
      #
      # GitHub Secret:
      # SOURCE_DB_URL
      #
      # Example format:
      # postgresql://postgres.<project-ref>:PASSWORD@aws-0-REGION.pooler.supabase.com:6543/postgres
      # ==========================================================
      - name: Set SOURCE Database URL
        env:
          SOURCE_DB_URL_SECRET: ${{ secrets.SOURCE_DB_URL }}
        run: |
          set -e

          if [ -z "$SOURCE_DB_URL_SECRET" ]; then
            echo "ERROR: SOURCE_DB_URL secret is empty."
            exit 1
          fi

          echo "SOURCE_DB_URL=$SOURCE_DB_URL_SECRET" >> "$GITHUB_ENV"

          echo "SOURCE database URL configured."

      # ==========================================================
      # 7. TEST SOURCE CONNECTION
      # ==========================================================
      - name: Test SOURCE Database Connection
        run: |
          set -e

          echo "=========================================="
          echo "TESTING SOURCE DATABASE CONNECTION"
          echo "=========================================="

          psql \
            "$SOURCE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user;"

          echo ""
          echo "SOURCE database connection successful."

      # ==========================================================
      # 8. EXPORT SOURCE SCHEMA
      #
      # IMPORTANT:
      # This exports schema ONLY.
      #
      # NO table data is copied.
      #
      # It does not use supabase db pull, so existing
      # migration-history mismatch will NOT stop this export.
      # ==========================================================
      - name: Export SOURCE Schema
        run: |
          set -e

          echo "=========================================="
          echo "EXPORTING SOURCE SCHEMA"
          echo "=========================================="

          rm -rf migration
          mkdir -p migration

          supabase db dump \
            --db-url "$SOURCE_DB_URL" \
            -f migration/schema.sql

          echo ""
          echo "=========================================="
          echo "SOURCE SCHEMA EXPORT COMPLETED"
          echo "=========================================="

          ls -lh migration/schema.sql

      # ==========================================================
      # 9. INSPECT SOURCE SCHEMA
      # ==========================================================
      - name: Inspect Exported Schema
        run: |
          set -e

          echo "=========================================="
          echo "SCHEMA STATISTICS"
          echo "=========================================="

          echo ""
          echo "SQL FILE:"
          ls -lh migration/schema.sql

          echo ""
          echo "TOTAL SQL LINES:"
          wc -l migration/schema.sql

          echo ""
          echo "TABLES:"
          grep -iE 'CREATE TABLE' \
            migration/schema.sql || true

          echo ""
          echo "FUNCTIONS:"
          grep -iE 'CREATE (OR REPLACE )?FUNCTION' \
            migration/schema.sql || true

          echo ""
          echo "TRIGGERS:"
          grep -iE 'CREATE TRIGGER' \
            migration/schema.sql || true

          echo ""
          echo "POLICIES:"
          grep -iE 'CREATE POLICY' \
            migration/schema.sql || true

          echo ""
          echo "VIEWS:"
          grep -iE 'CREATE (OR REPLACE )?VIEW' \
            migration/schema.sql || true

          echo ""
          echo "INDEXES:"
          grep -iE 'CREATE (UNIQUE )?INDEX' \
            migration/schema.sql || true

      # ==========================================================
      # 10. LOGIN TO TARGET
      # ==========================================================
      - name: Login to TARGET
        env:
          TARGET_SUPABASE_ACCESS_TOKEN: ${{ secrets.TARGET_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "LOGIN TARGET"
          echo "=========================================="

          supabase login \
            --token "$TARGET_SUPABASE_ACCESS_TOKEN"

      # ==========================================================
      # 11. SET TARGET DATABASE URL
      #
      # GitHub Secret:
      # TARGET_DB_URL
      #
      # Use Transaction Pooler connection string.
      # ==========================================================
      - name: Set TARGET Database URL
        env:
          TARGET_DB_URL_SECRET: ${{ secrets.TARGET_DB_URL }}
        run: |
          set -e

          if [ -z "$TARGET_DB_URL_SECRET" ]; then
            echo "ERROR: TARGET_DB_URL secret is empty."
            exit 1
          fi

          echo "TARGET_DB_URL=$TARGET_DB_URL_SECRET" >> "$GITHUB_ENV"

          echo "TARGET database URL configured."

      # ==========================================================
      # 12. TEST TARGET CONNECTION
      # ==========================================================
      - name: Test TARGET Database Connection
        run: |
          set -e

          echo "=========================================="
          echo "TESTING TARGET DATABASE CONNECTION"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user;"

          echo ""
          echo "TARGET database connection successful."

      # ==========================================================
      # 13. RESTORE SCHEMA TO TARGET
      #
      # IMPORTANT:
      # Target is a NEW Supabase project.
      #
      # We intentionally use psql instead of supabase db push.
      # This avoids migration-history conflicts.
      # ==========================================================
      - name: Restore Schema to TARGET
        run: |
          set -e

          echo "=========================================="
          echo "RESTORING SCHEMA TO TARGET"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file migration/schema.sql

          echo ""
          echo "=========================================="
          echo "TARGET SCHEMA RESTORE COMPLETED"
          echo "=========================================="

      # ==========================================================
      # 14. VERIFY TARGET TABLES
      # ==========================================================
      - name: Verify TARGET Tables
        run: |
          set -e

          echo "=========================================="
          echo "TARGET TABLES"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                schemaname,
                tablename
              FROM pg_tables
              WHERE schemaname NOT IN (
                'pg_catalog',
                'information_schema'
              )
              ORDER BY
                schemaname,
                tablename;
            "

      # ==========================================================
      # 15. VERIFY TARGET FUNCTIONS
      # ==========================================================
      - name: Verify TARGET Functions
        run: |
          set -e

          echo "=========================================="
          echo "TARGET FUNCTIONS"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                n.nspname AS schema_name,
                p.proname AS function_name
              FROM pg_proc p
              JOIN pg_namespace n
                ON n.oid = p.pronamespace
              WHERE n.nspname NOT IN (
                'pg_catalog',
                'information_schema'
              )
              ORDER BY
                n.nspname,
                p.proname;
            "

      # ==========================================================
      # 16. VERIFY TARGET TRIGGERS
      # ==========================================================
      - name: Verify TARGET Triggers
        run: |
          set -e

          echo "=========================================="
          echo "TARGET TRIGGERS"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                event_object_schema AS schema_name,
                event_object_table AS table_name,
                trigger_name
              FROM information_schema.triggers
              ORDER BY
                event_object_schema,
                event_object_table,
                trigger_name;
            "

      # ==========================================================
      # 17. VERIFY TARGET RLS POLICIES
      # ==========================================================
      - name: Verify TARGET RLS Policies
        run: |
          set -e

          echo "=========================================="
          echo "TARGET RLS POLICIES"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                schemaname,
                tablename,
                policyname
              FROM pg_policies
              ORDER BY
                schemaname,
                tablename,
                policyname;
            "

      # ==========================================================
      # 18. VERIFY TARGET VIEWS
      # ==========================================================
      - name: Verify TARGET Views
        run: |
          set -e

          echo "=========================================="
          echo "TARGET VIEWS"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                schemaname,
                viewname
              FROM pg_views
              WHERE schemaname NOT IN (
                'pg_catalog',
                'information_schema'
              )
              ORDER BY
                schemaname,
                viewname;
            "

      # ==========================================================
      # 19. UPLOAD SCHEMA ARTIFACT
      # ==========================================================
      - name: Upload Schema Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-schema-${{ github.run_number }}
          path: migration/schema.sql
          retention-days: 7

      # ==========================================================
      # 20. FINAL SUMMARY
      # ==========================================================
      - name: Migration Summary
        if: always()
        env:
          SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          echo ""
          echo "=========================================="
          echo "SUPABASE SCHEMA MIGRATION SUMMARY"
          echo "=========================================="
          echo ""
          echo "SOURCE:"
          echo "$SOURCE_PROJECT_REF"
          echo ""
          echo "TARGET:"
          echo "$TARGET_PROJECT_REF"
          echo ""
          echo "Migrated:"
          echo "  [OK] Database schema"
          echo "  [OK] Tables"
          echo "  [OK] Views"
          echo "  [OK] PostgreSQL functions"
          echo "  [OK] Triggers"
          echo "  [OK] Indexes"
          echo "  [OK] RLS policies"
          echo ""
          echo "NOT migrated:"
          echo "  [--] Table data"
          echo "  [--] Storage files"
          echo "  [--] Edge Functions"
          echo "  [--] Edge Function secrets"
          echo ""
          echo "=========================================="

      # ==========================================================
      # 21. CLEANUP
      # ==========================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf .supabase
          rm -rf migration

          echo "Cleanup completed."
