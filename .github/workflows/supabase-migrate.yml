name: Supabase Complete Cross-Org Sync (DB & Edge Functions)

on:
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Supabase CLI
      # ============================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # ============================================================
      # 3. Authenticate SOURCE Supabase account
      # ============================================================
      - name: Authenticate Source Supabase Account
        env:
          SOURCE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SOURCE_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "========================================"
          echo "Authenticating SOURCE account"
          echo "========================================"

          supabase login --token "$SOURCE_SUPABASE_ACCESS_TOKEN"

          echo "Source authentication successful."

      # ============================================================
      # 4. Link SOURCE project
      # ============================================================
      - name: Link Source Project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
          SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
        run: |
          set -e

          echo "========================================"
          echo "Connecting to SOURCE project"
          echo "Project: $SOURCE_PROJECT_REF"
          echo "========================================"

          rm -rf .supabase

          supabase link \
            --project-ref "$SOURCE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Source project linked successfully."

      # ============================================================
      # 5. Show SOURCE migration history
      # ============================================================
      - name: Check Source Migration History
        run: |
          set -e

          echo "========================================"
          echo "SOURCE migration history"
          echo "========================================"

          supabase migration list

      # ============================================================
      # 6. Repair stale SOURCE migration
      #
      # IMPORTANT:
      # Only use this if 20260906023724 is confirmed to be a stale
      # migration that should NOT be considered applied.
      # ============================================================
      - name: Repair Source Migration History
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
        run: |
          set -e

          MIGRATION_ID="20260906023724"

          echo "========================================"
          echo "Repairing SOURCE migration history"
          echo "Migration: $MIGRATION_ID"
          echo "========================================"

          supabase migration repair \
            --status reverted \
            "$MIGRATION_ID"

          echo "Migration repair completed."

      # ============================================================
      # 7. Pull SOURCE schema
      # ============================================================
      - name: Pull Schema from Source
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "Pulling database schema from SOURCE"
          echo "========================================"

          supabase db pull

          echo ""
          echo "Source schema pulled successfully."

      # ============================================================
      # 8. Display resulting migrations
      # ============================================================
      - name: Show Source Migrations
        run: |
          echo "========================================"
          echo "SOURCE migrations after db pull"
          echo "========================================"

          if [ -d "supabase/migrations" ]; then
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -printf "%f\n" \
              | sort
          else
            echo "No migration directory found."
          fi

      # ============================================================
      # 9. Reset SOURCE link
      # ============================================================
      - name: Reset Source Link
        run: |
          rm -rf .supabase

          echo "Source link removed."

      # ============================================================
      # 10. Authenticate TARGET Supabase account
      # ============================================================
      - name: Authenticate Target Supabase Account
        env:
          TARGET_SUPABASE_ACCESS_TOKEN: ${{ secrets.TARGET_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "========================================"
          echo "Authenticating TARGET account"
          echo "========================================"

          supabase login --token "$TARGET_SUPABASE_ACCESS_TOKEN"

          echo "Target authentication successful."

      # ============================================================
      # 11. Link TARGET project
      # ============================================================
      - name: Link Target Project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          set -e

          echo "========================================"
          echo "Connecting to TARGET project"
          echo "Project: $TARGET_PROJECT_REF"
          echo "========================================"

          rm -rf .supabase

          supabase link \
            --project-ref "$TARGET_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Target project linked successfully."

      # ============================================================
      # 12. Check TARGET migration history
      # ============================================================
      - name: Check Target Migration History
        run: |
          set -e

          echo "========================================"
          echo "TARGET migration history"
          echo "========================================"

          supabase migration list

      # ============================================================
      # 13. Push schema to TARGET
      # ============================================================
      - name: Push Schema to Target
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "Pushing database schema to TARGET"
          echo "========================================"

          supabase db push

          echo ""
          echo "Database synchronization completed."

      # ============================================================
      # 14. Deploy Edge Functions
      # ============================================================
      - name: Deploy Edge Functions
        env:
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          set -e

          echo "========================================"
          echo "Deploying Edge Functions"
          echo "Target: $TARGET_PROJECT_REF"
          echo "========================================"

          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory found."
            echo "Skipping Edge Functions."
            exit 0
          fi

          found_functions=false

          for dir in supabase/functions/*/; do

            if [ -d "$dir" ]; then

              func_name=$(basename "$dir")

              if [ "$func_name" = "_shared" ]; then
                echo "Skipping _shared directory."
                continue
              fi

              found_functions=true

              echo ""
              echo "----------------------------------------"
              echo "Deploying: $func_name"
              echo "----------------------------------------"

              supabase functions deploy "$func_name" \
                --project-ref "$TARGET_PROJECT_REF"

              echo "Successfully deployed: $func_name"

            fi

          done

          if [ "$found_functions" = false ]; then
            echo "No Edge Functions found."
          fi

          echo ""
          echo "Edge Function deployment completed."

      # ============================================================
      # 15. Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf .supabase

          echo "========================================"
          echo "Cleanup completed."
          echo "========================================"
