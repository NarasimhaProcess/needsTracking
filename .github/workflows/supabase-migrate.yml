name: Supabase Complete Cross-Org Sync (DB & Edge Functions)

on:
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Supabase CLI
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # 3. Authenticate Supabase CLI
      - name: Authenticate Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      # 4. Pull database schema from SOURCE project
      - name: Pull Schema from Source
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
          SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
        run: |
          set -e

          echo "Linking to source project: $SOURCE_PROJECT_REF"

          rm -rf .supabase

          supabase link \
            --project-ref "$SOURCE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Pulling schema from source..."

          supabase db pull

          echo "Source schema pulled successfully."

      # 5. Remove source project link
      - name: Reset Supabase Link
        run: |
          rm -rf .supabase

      # 6. Link to TARGET project
      - name: Link Target Project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          set -e

          echo "Linking to target project: $TARGET_PROJECT_REF"

          supabase link \
            --project-ref "$TARGET_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Target project linked successfully."

      # 7. Push database schema to TARGET project
      - name: Push Schema to Target
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
        run: |
          set -e

          echo "Pushing database migrations to target..."

          supabase db push

          echo "Database sync completed successfully."

      # 8. Deploy Edge Functions to TARGET project
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          set -e

          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory found."
            exit 0
          fi

          for dir in supabase/functions/*/; do
            if [ -d "$dir" ]; then
              func_name=$(basename "$dir")

              echo "----------------------------------------"
              echo "Deploying edge function: $func_name"
              echo "Target project: $TARGET_PROJECT_REF"
              echo "----------------------------------------"

              supabase functions deploy "$func_name" \
                --project-ref "$TARGET_PROJECT_REF"
            fi
          done

          echo "All Edge Functions deployed successfully."

      # 9. Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -rf .supabase
          echo "Cleanup completed."
