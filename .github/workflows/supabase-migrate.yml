name: Supabase Schema Migration

on:
  workflow_dispatch:

jobs:
  migrate-schema:
    runs-on: ubuntu-latest

    env:
      SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
      TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP SUPABASE CLI
      # ==========================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # ==========================================================
      # 3. INSTALL POSTGRESQL CLIENT
      # ==========================================================
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ==========================================================
      # 4. SHOW CONFIGURATION
      # ==========================================================
      - name: Show Configuration
        run: |
          echo "=========================================="
          echo "SUPABASE SCHEMA MIGRATION"
          echo "=========================================="
          echo "SOURCE : $SOURCE_PROJECT_REF"
          echo "TARGET : $TARGET_PROJECT_REF"
          echo "=========================================="

      # ==========================================================
      # 5. LOGIN TO SOURCE
      # ==========================================================
      - name: Login to SOURCE
        env:
          SOURCE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SOURCE_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "LOGIN SOURCE"
          echo "=========================================="

          supabase login \
            --token "$SOURCE_SUPABASE_ACCESS_TOKEN"

      # ==========================================================
      # 6. BUILD SOURCE DATABASE URL
      # ==========================================================
      - name: Build SOURCE Database URL
        env:
          SOURCE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
        run: |
          set -e

          echo "Creating SOURCE database connection..."

          echo "SOURCE_DB_URL=postgresql://postgres:${SOURCE_DB_PASSWORD}@db.${SOURCE_PROJECT_REF}.supabase.co:5432/postgres" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. EXPORT SOURCE SCHEMA
      #
      # IMPORTANT:
      # This uses db dump instead of db pull.
      # Therefore local migration history is NOT checked.
      #
      # Schema only:
      # - Tables
      # - Columns
      # - Indexes
      # - Functions
      # - Triggers
      # - Views
      # - RLS policies
      # - Extensions
      #
      # NO TABLE DATA IS COPIED.
      # ==========================================================
      - name: Export SOURCE Schema
        run: |
          set -e

          echo "=========================================="
          echo "EXPORTING SOURCE SCHEMA"
          echo "=========================================="

          mkdir -p migration

          supabase db dump \
            --db-url "$SOURCE_DB_URL" \
            -f migration/schema.sql

          echo ""
          echo "=========================================="
          echo "SOURCE SCHEMA EXPORT COMPLETED"
          echo "=========================================="

          ls -lh migration/schema.sql

      # ==========================================================
      # 8. INSPECT EXPORTED SCHEMA
      # ==========================================================
      - name: Inspect Exported Schema
        run: |
          set -e

          echo "=========================================="
          echo "SCHEMA STATISTICS"
          echo "=========================================="

          echo ""
          echo "Total SQL lines:"
          wc -l migration/schema.sql

          echo ""
          echo "TABLES:"
          grep -iE 'CREATE TABLE' \
            migration/schema.sql || true

          echo ""
          echo "FUNCTIONS:"
          grep -iE 'CREATE (OR REPLACE )?FUNCTION' \
            migration/schema.sql || true

          echo ""
          echo "TRIGGERS:"
          grep -iE 'CREATE TRIGGER' \
            migration/schema.sql || true

          echo ""
          echo "POLICIES:"
          grep -iE 'CREATE POLICY' \
            migration/schema.sql || true

          echo ""
          echo "VIEWS:"
          grep -iE 'CREATE (OR REPLACE )?VIEW' \
            migration/schema.sql || true

          echo ""
          echo "INDEXES:"
          grep -iE 'CREATE (UNIQUE )?INDEX' \
            migration/schema.sql || true

      # ==========================================================
      # 9. LOGIN TO TARGET
      # ==========================================================
      - name: Login to TARGET
        env:
          TARGET_SUPABASE_ACCESS_TOKEN: ${{ secrets.TARGET_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "LOGIN TARGET"
          echo "=========================================="

          supabase login \
            --token "$TARGET_SUPABASE_ACCESS_TOKEN"

      # ==========================================================
      # 10. BUILD TARGET DATABASE URL
      # ==========================================================
      - name: Build TARGET Database URL
        env:
          TARGET_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
        run: |
          set -e

          echo "Creating TARGET database connection..."

          echo "TARGET_DB_URL=postgresql://postgres:${TARGET_DB_PASSWORD}@db.${TARGET_PROJECT_REF}.supabase.co:5432/postgres" >> "$GITHUB_ENV"

      # ==========================================================
      # 11. TEST TARGET CONNECTION
      # ==========================================================
      - name: Test TARGET Connection
        run: |
          set -e

          echo "=========================================="
          echo "TESTING TARGET DATABASE CONNECTION"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user;"

          echo ""
          echo "TARGET connection successful."

      # ==========================================================
      # 12. RESTORE SCHEMA TO TARGET
      #
      # IMPORTANT:
      # Target is a NEW Supabase project.
      #
      # This does NOT use:
      # supabase db push
      #
      # Therefore target migration history does not matter.
      # ==========================================================
      - name: Restore Schema to TARGET
        run: |
          set -e

          echo "=========================================="
          echo "RESTORING SOURCE SCHEMA TO TARGET"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file migration/schema.sql

          echo ""
          echo "=========================================="
          echo "TARGET SCHEMA RESTORE COMPLETED"
          echo "=========================================="

      # ==========================================================
      # 13. VERIFY TARGET TABLES
      # ==========================================================
      - name: Verify TARGET Tables
        run: |
          set -e

          echo "=========================================="
          echo "TARGET TABLES"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                schemaname,
                tablename
              FROM pg_tables
              WHERE schemaname NOT IN (
                'pg_catalog',
                'information_schema'
              )
              ORDER BY schemaname, tablename;
            "

      # ==========================================================
      # 14. VERIFY TARGET FUNCTIONS
      # ==========================================================
      - name: Verify TARGET Functions
        run: |
          set -e

          echo "=========================================="
          echo "TARGET FUNCTIONS"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                n.nspname AS schema_name,
                p.proname AS function_name
              FROM pg_proc p
              JOIN pg_namespace n
                ON n.oid = p.pronamespace
              WHERE n.nspname NOT IN (
                'pg_catalog',
                'information_schema'
              )
              ORDER BY n.nspname, p.proname;
            "

      # ==========================================================
      # 15. VERIFY TARGET TRIGGERS
      # ==========================================================
      - name: Verify TARGET Triggers
        run: |
          set -e

          echo "=========================================="
          echo "TARGET TRIGGERS"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                event_object_schema AS schema_name,
                event_object_table AS table_name,
                trigger_name
              FROM information_schema.triggers
              ORDER BY
                event_object_schema,
                event_object_table,
                trigger_name;
            "

      # ==========================================================
      # 16. VERIFY TARGET POLICIES
      # ==========================================================
      - name: Verify TARGET RLS Policies
        run: |
          set -e

          echo "=========================================="
          echo "TARGET RLS POLICIES"
          echo "=========================================="

          psql \
            "$TARGET_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT
                schemaname,
                tablename,
                policyname
              FROM pg_policies
              ORDER BY
                schemaname,
                tablename,
                policyname;
            "

      # ==========================================================
      # 17. SAVE SCHEMA AS GITHUB ARTIFACT
      # ==========================================================
      - name: Upload Schema Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-schema-${{ github.run_number }}
          path: migration/schema.sql
          retention-days: 7

      # ==========================================================
      # 18. FINAL SUMMARY
      # ==========================================================
      - name: Migration Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "SUPABASE SCHEMA MIGRATION SUMMARY"
          echo "=========================================="
          echo ""
          echo "SOURCE:"
          echo "$SOURCE_PROJECT_REF"
          echo ""
          echo "TARGET:"
          echo "$TARGET_PROJECT_REF"
          echo ""
          echo "Migrated:"
          echo "  - Database schema"
          echo "  - Tables"
          echo "  - Views"
          echo "  - Functions"
          echo "  - Triggers"
          echo "  - Indexes"
          echo "  - RLS policies"
          echo "  - Schema-level objects"
          echo ""
          echo "NOT migrated:"
          echo "  - Table data"
          echo "  - Storage files"
          echo "  - Edge Functions"
          echo "  - Edge Function secrets"
          echo ""
          echo "=========================================="

      # ==========================================================
      # 19. CLEANUP
      # ==========================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf .supabase
          rm -f "$GITHUB_ENV" 2>/dev/null || true

          echo "Cleanup completed."
