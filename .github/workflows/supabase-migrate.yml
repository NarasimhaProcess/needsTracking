name: Supabase Complete Cross-Org Sync (DB & Edge Functions)

on:
  workflow_dispatch: # Allows you to manually trigger the sync from the GitHub Actions UI

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Pull your codebase (contains your local edge functions folder)
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install a stable, locked version of the Supabase CLI environment
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: '1.200.0' # Pinned to a stable release to resolve edge-runtime errors

    # 3. Authenticate the CLI session using your encrypted token secret
    - name: Authenticate Supabase CLI
      run: |
        supabase login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"

    # 4. Pull down the database structural layout from User A (Source)
    - name: Pull Schema from Source
      run: |
        # Links using the Project Ref from your Variables tab
        supabase link --project-ref "${{ vars.SOURCE_PROJECT_REF }}"
        
        # Extracts structural configurations into memory layout
        supabase db pull

    # 5. Clear the local cache link so the runner switches contexts cleanly
    - name: Reset Local Link Cache
      run: rm -rf .supabase/

    # 6. Connect to User B (Target) and push the schema structure
    - name: Apply Schema to Target Project
      run: |
        # Links using Target Project Ref from Variables and Password from Secrets
        supabase link --project-ref "${{ vars.TARGET_PROJECT_REF }}" -p "${{ secrets.TARGET_DB_PASSWORD }}"
        
        # Pushes your database tables, schemas, and configurations
        supabase db push
        
        # Wipe structural caches post-sync to keep workspace clean
        rm -rf .supabase/ 

    # 7. Host and deploy all local Edge Functions directly to User B's project
    - name: Host and Deploy Edge Functions
      run: |
        # Loops through and deploys every function directory inside your repository
        for dir in supabase/functions/*/; do
          if [ -d "$dir" ]; then
            func_name=$(basename "$dir")
            echo "Deploying edge function: $func_name"
            supabase functions deploy "$func_name" --project-ref "${{ vars.TARGET_PROJECT_REF }}"
          fi
        done
