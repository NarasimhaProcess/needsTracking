name: Supabase Complete Cross-Org Sync (DB & Edge Functions)

on:
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Supabase CLI
      # ============================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # ============================================================
      # 3. Authenticate Supabase CLI
      # ============================================================
      - name: Authenticate Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "Authenticating Supabase CLI..."

          supabase login --token "$SUPABASE_ACCESS_TOKEN"

          echo "Supabase CLI authentication successful."

      # ============================================================
      # 4. Connect to SOURCE project
      # ============================================================
      - name: Link Source Project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
          SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
        run: |
          set -e

          echo "========================================"
          echo "Connecting to SOURCE project"
          echo "Project: $SOURCE_PROJECT_REF"
          echo "========================================"

          rm -rf .supabase

          supabase link \
            --project-ref "$SOURCE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Source project linked successfully."

      # ============================================================
      # 5. Check SOURCE migration history
      # ============================================================
      - name: Check Source Migration History
        run: |
          set -e

          echo "========================================"
          echo "Checking source migration history"
          echo "========================================"

          supabase migration list || true

      # ============================================================
      # 6. Repair stale migration
      #
      # IMPORTANT:
      # This marks migration 20260906020225 as reverted.
      #
      # Only keep this step if this migration is confirmed to be
      # stale/obsolete in the SOURCE database.
      # ============================================================
      - name: Repair Source Migration History
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
        run: |
          set -e

          MIGRATION_ID="20260906020225"

          echo "========================================"
          echo "Repairing migration history"
          echo "Migration: $MIGRATION_ID"
          echo "========================================"

          supabase migration repair \
            --status reverted \
            "$MIGRATION_ID"

          echo "Migration history repaired."

      # ============================================================
      # 7. Pull current SOURCE schema
      # ============================================================
      - name: Pull Schema from Source
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "Pulling schema from SOURCE"
          echo "========================================"

          supabase db pull

          echo "Source schema pulled successfully."

      # ============================================================
      # 8. Show generated migration files
      # ============================================================
      - name: Show Pulled Migrations
        run: |
          echo "========================================"
          echo "Current migration files"
          echo "========================================"

          if [ -d "supabase/migrations" ]; then
            ls -la supabase/migrations/
          else
            echo "No supabase/migrations directory found."
          fi

      # ============================================================
      # 9. Remove SOURCE link
      # ============================================================
      - name: Reset Source Link
        run: |
          rm -rf .supabase

          echo "Source project link removed."

      # ============================================================
      # 10. Connect to TARGET project
      # ============================================================
      - name: Link Target Project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          set -e

          echo "========================================"
          echo "Connecting to TARGET project"
          echo "Project: $TARGET_PROJECT_REF"
          echo "========================================"

          rm -rf .supabase

          supabase link \
            --project-ref "$TARGET_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Target project linked successfully."

      # ============================================================
      # 11. Check TARGET migration history
      # ============================================================
      - name: Check Target Migration History
        run: |
          set -e

          echo "========================================"
          echo "Checking target migration history"
          echo "========================================"

          supabase migration list || true

      # ============================================================
      # 12. Push schema/migrations to TARGET
      # ============================================================
      - name: Push Schema to Target
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "Pushing migrations to TARGET"
          echo "========================================"

          supabase db push

          echo "Database synchronization completed."

      # ============================================================
      # 13. Deploy Edge Functions
      # ============================================================
      - name: Deploy Edge Functions
        env:
          TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
        run: |
          set -e

          echo "========================================"
          echo "Deploying Edge Functions"
          echo "Target: $TARGET_PROJECT_REF"
          echo "========================================"

          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory found."
            echo "Skipping Edge Function deployment."
            exit 0
          fi

          for dir in supabase/functions/*/; do

            if [ -d "$dir" ]; then

              func_name=$(basename "$dir")

              # Skip common non-function directories
              if [ "$func_name" = "_shared" ]; then
                echo "Skipping _shared directory."
                continue
              fi

              echo "----------------------------------------"
              echo "Deploying Edge Function: $func_name"
              echo "----------------------------------------"

              supabase functions deploy "$func_name" \
                --project-ref "$TARGET_PROJECT_REF"

              echo "Successfully deployed: $func_name"
            fi

          done

          echo "========================================"
          echo "All Edge Functions deployed successfully."
          echo "========================================"

      # ============================================================
      # 14. Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf .supabase

          echo "========================================"
          echo "Cleanup completed."
          echo "========================================"
