name: Deploy Web App to GitHub Pages

on:
  workflow_dispatch: # Allows manual runs only. No automatic triggers on push.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # STEP 1: Safely inject environment secrets from GitHub Settings
      - name: Create .env file with Secrets
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_ORG_NAME=${{ secrets.ORG_NAME }}
          EOF
          echo "✅ .env file created with EXPO_PUBLIC prefixes"
      
      - name: Install dependencies
        run: npm ci
      
      # STEP 2: Compile the project into static web assets
      - name: Export web build
        run: npx expo export --platform web
      
      - name: Build web app
        run: npm run build --if-present
      
      # STEP 3: Map output folder (dist) and prepare it for GitHub Pages
      - name: Generate dist folder for GitHub Pages
        run: |
          if [ ! -d "dist" ]; then
            mkdir -p dist
            if [ -d "web-build" ]; then
              cp -r web-build/* dist/
            elif [ -d ".expo/web" ]; then
              cp -r .expo/web/* dist/
            fi
          fi
          touch dist/.nojekyll
          echo "✅ dist folder prepared"
      
      # STEP 4: Push compiled code directly to your isolated gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: needstracking.com
      
      - name: Generate Deploy Summary
        if: always()
        run: |
          echo "## 🌐 Web Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Published URL: https://github.io" >> $GITHUB_STEP_SUMMARY
          echo "- Custom Domain: needstracking.com" >> $GITHUB_STEP_SUMMARY
