
name: Deploy Web App to GitHub Pages

on:
  workflow_dispatch:

# Give GitHub Actions permission to write to the repository.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ----------------------------------------
      # 3. Create environment file
      # ----------------------------------------
      - name: Create .env
        shell: bash
        run: |
          set -e

          RESOLVED_URL="${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}"
          RESOLVED_KEY="${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}"
          RESOLVED_MAPS_KEY="${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY || vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}"
          RESOLVED_ORG="${{ secrets.EXPO_PUBLIC_ORG_NAME || secrets.ORG_NAME || vars.EXPO_PUBLIC_ORG_NAME || vars.ORG_NAME || 'Store' }}"

          if [ ! -f .env ]; then
            if [ -z "$RESOLVED_URL" ]; then
              echo "::error::SUPABASE_URL is missing! Please add SUPABASE_URL in GitHub Repository Secrets or Variables, or commit a .env file."
              exit 1
            fi

            if [ -z "$RESOLVED_KEY" ]; then
              echo "::error::SUPABASE_ANON_KEY is missing! Please add SUPABASE_ANON_KEY in GitHub Repository Secrets or Variables, or commit a .env file."
              exit 1
            fi

            cat > .env << EOF
          EXPO_PUBLIC_SUPABASE_URL=$RESOLVED_URL
          EXPO_PUBLIC_SUPABASE_ANON_KEY=$RESOLVED_KEY
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$RESOLVED_MAPS_KEY
          EXPO_PUBLIC_ORG_NAME=$RESOLVED_ORG
          SUPABASE_URL=$RESOLVED_URL
          SUPABASE_ANON_KEY=$RESOLVED_KEY
          EOF

            echo "✅ .env created from GitHub Actions Secrets/Variables"
          else
            echo "✅ Using existing .env file found in repository"
          fi

      # ----------------------------------------
      # 4. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # 5. Clean previous web output
      # ----------------------------------------
      - name: Clean web build
        run: |
          rm -rf dist
          rm -rf web-build
          rm -rf .expo/web

      # ----------------------------------------
      # 6. Export Expo web application
      # ----------------------------------------
      - name: Export Expo web build
        run: |
          npx expo export --platform web

      # ----------------------------------------
      # 7. Verify web build
      # ----------------------------------------
      - name: Verify web build
        shell: bash
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "::error::dist directory was not generated!"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html was not generated!"
            echo ""
            echo "Generated files:"
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "========================================"
          echo "✅ Web build generated"
          echo "========================================"

          find dist -maxdepth 3 -type f | sort
          du -sh dist

      # ----------------------------------------
      # 8. Prepare GitHub Pages
      # ----------------------------------------
      - name: Prepare GitHub Pages
        run: |
          touch dist/.nojekyll
          echo "needstracking.com" > dist/CNAME

          echo "✅ GitHub Pages files prepared"

      # ----------------------------------------
      # 9. Deploy to gh-pages
      # ----------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: needstracking.com
          force_orphan: true
          enable_jekyll: false

      # ----------------------------------------
      # 10. Summary
      # ----------------------------------------
      - name: Generate Deploy Summary
        if: success()
        run: |
          echo "## 🌐 Web Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ✅ Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: gh-pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom domain: https://needstracking.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build directory: dist" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Failure Summary
        if: failure()
        run: |
          echo "## ❌ Web Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above." >> "$GITHUB_STEP_SUMMARY"
