name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages & writing to repo
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ----------------------------------------
      # 3. Create environment file
      # ----------------------------------------
      - name: Create .env
        shell: bash
        run: |
          set -e

          RESOLVED_URL="${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || 'https://cikxysaxvbixrcwlgzds.supabase.co' }}"
          RESOLVED_KEY="${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpa3h5c2F4dmJpeHJjd2xnemRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MzA2MjgsImV4cCI6MjEwNDIwNjYyOH0.YIc4KXr055r1D3-mKW1bCn06GNWWK4TXettqhazgpg4' }}"
          RESOLVED_MAPS_KEY="${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY || vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}"
          RESOLVED_ORG="${{ secrets.EXPO_PUBLIC_ORG_NAME || secrets.ORG_NAME || vars.EXPO_PUBLIC_ORG_NAME || vars.ORG_NAME || 'Store' }}"

          cat > .env << EOF
          EXPO_PUBLIC_SUPABASE_URL=$RESOLVED_URL
          EXPO_PUBLIC_SUPABASE_ANON_KEY=$RESOLVED_KEY
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=$RESOLVED_MAPS_KEY
          EXPO_PUBLIC_ORG_NAME=$RESOLVED_ORG
          SUPABASE_URL=$RESOLVED_URL
          SUPABASE_ANON_KEY=$RESOLVED_KEY
          EOF

          echo "✅ .env created successfully"

      # ----------------------------------------
      # 4. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # 5. Clean previous web output
      # ----------------------------------------
      - name: Clean web build
        run: |
          rm -rf dist
          rm -rf web-build
          rm -rf .expo/web

      # ----------------------------------------
      # 6. Export Expo web application
      # ----------------------------------------
      - name: Export Expo web build
        run: |
          npx expo export --platform web

      # ----------------------------------------
      # 7. Verify web build
      # ----------------------------------------
      - name: Verify web build
        shell: bash
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "::error::dist directory was not generated!"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html was not generated!"
            exit 1
          fi

          echo "========================================"
          echo "✅ Web build generated successfully"
          echo "========================================"

          find dist -maxdepth 3 -type f | sort
          du -sh dist

      # ----------------------------------------
      # 8. Prepare GitHub Pages
      # ----------------------------------------
      - name: Prepare GitHub Pages
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          rm -f dist/CNAME

          echo "✅ GitHub Pages files prepared (.nojekyll, 404.html, no CNAME)"

      # ----------------------------------------
      # 9. Deploy to GitHub Pages (Workflow Mode)
      # ----------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ----------------------------------------
      # 10. Also push to gh-pages branch (Legacy Mode Backup)
      # ----------------------------------------
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false

      # ----------------------------------------
      # 11. Summary
      # ----------------------------------------
      - name: Generate Deploy Summary
        if: success()
        run: |
          echo "## 🌐 Web Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ✅ Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch Backup: gh-pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build directory: dist" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Failure Summary
        if: failure()
        run: |
          echo "## ❌ Web Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above." >> "$GITHUB_STEP_SUMMARY"
