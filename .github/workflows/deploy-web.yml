name: Build Android APK - Gradle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # STEP 1: Generate native android/ folders FIRST
      - name: Generate Android project
        run: |
          npx expo prebuild --platform android --non-interactive

      # STEP 2: Create the .env file inside the project root AFTER prebuild
      - name: Create .env and Verify Setup
        run: |
          URL_VAL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$URL_VAL" ]; then
            echo "::error::Critical Build Error: SUPABASE_URL is missing in GitHub Secrets!"
            exit 1
          fi
          
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_ORG_NAME=${{ secrets.ORG_NAME }}" >> .env
          
          echo "=== Verifying .env contents for debugging ==="
          cat .env

      # FIX STEP 3: Create assets folder and export the JS bundle into the native path Gradle expects
      - name: Force Package Production JS Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export --platform android --output-dir android/app/src/main/assets
          
          # Rename the bundle so the native Android wrapper can resolve the script entrypoint
          cp android/app/src/main/assets/user-bundle.js android/app/src/main/assets/index.android.bundle

      - name: Create Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/local.properties
          echo "org.gradle.parallel=true" >> android/local.properties

      # STEP 4: Compile the standalone production APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             needsTracking-development-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: needsTracking-development-apk
          path: needsTracking-development-release.apk
          retention-days: 30
