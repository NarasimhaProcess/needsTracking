name: Build Private Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Create environment variables BEFORE Expo prebuild
      - name: Create .env
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::Critical Build Error: SUPABASE_URL is missing in GitHub Secrets!"
            exit 1
          fi

          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_ORG_NAME=${{ secrets.ORG_NAME }}" >> .env

          echo "Environment file created successfully."

      # Generate native Android project
      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      # Configure Android SDK location
      - name: Create Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Build production APK.
      # Expo/React Native Gradle integration creates the JS bundle automatically.
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      # Verify APK exists
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated!"
            echo "Searching for generated APK files..."
            find android -name "*.apk" -type f
            exit 1
          fi

          echo "✅ APK successfully generated:"
          ls -lh "$APK_PATH"

      # Rename APK for private use
      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             needsTracking-private.apk

          echo "✅ Final APK:"
          ls -lh needsTracking-private.apk

      # Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: needsTracking-private-apk
          path: needsTracking-private.apk
          retention-days: 30
