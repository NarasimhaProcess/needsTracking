name: Build Android APK - Gradle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "ORG_NAME=${{ secrets.ORG_NAME }}" >> .env

      - name: Create Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/local.properties
          echo "org.gradle.parallel=true" >> android/local.properties

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             needsTracking-development-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: needsTracking-development-apk
          path: needsTracking-development-debug.apk
          retention-days: 30
