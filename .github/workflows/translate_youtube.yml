name: Translate YouTube Video via Gemini

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube Video URL"
        required: true
        type: string

      target_language:
        description: "Target language"
        required: true
        default: "Telugu"
        type: string

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-genai gtts yt-dlp

      - name: Verify files
        run: |
          echo "Working directory:"
          pwd

          echo "Files:"
          ls -la

          test -f process_video.py || {
            echo "ERROR: process_video.py not found"
            exit 1
          }

      - name: Check Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            exit 1
          fi

          echo "Gemini API key detected."

      - name: Prepare YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "YouTube cookies available."
          else
            echo "No YouTube cookies configured."
          fi

      - name: Update yt-dlp
        run: |
          yt-dlp --version
          yt-dlp -U || true

      - name: Run Video Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: |
          python process_video.py \
            --url "${{ github.event.inputs.video_url }}" \
            --lang "${{ github.event.inputs.target_language }}"

      - name: Clean sensitive files
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload translated video
        if: success()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: translated-youtube-video
          path: output/translated_video.mp4
          if-no-files-found: error
