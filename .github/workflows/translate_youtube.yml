name: Translate Uploaded Audio via Gemini

on:
  workflow_dispatch:
    inputs:
      audio_file:
        description: 'Upload your video audio track (MP3, WAV, or M4A)'
        required: true
        type: file
      target_language:
        description: 'Target language (e.g., Telugu, Indian English, Hindi)'
        required: true
        default: 'Telugu'

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai gtts

    - name: Run Audio Translation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python process_audio.py --file "${{ github.event.inputs.audio_file }}" --lang "${{ github.event.inputs.target_language }}"

    - name: Upload Translated Audio Artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: translated-audio-track
        path: output/translated_audio.mp3
