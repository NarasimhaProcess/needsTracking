name: Supabase Edge Functions and Storage Migration

on:
  workflow_dispatch:

jobs:
  migrate-edge-and-storage:
    runs-on: ubuntu-latest

    env:
      SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
      TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP SUPABASE CLI
      # ==========================================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # ==========================================================
      # 3. INSTALL AWS CLI V2 + JQ
      # ==========================================================
      - name: Install AWS CLI and jq
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl unzip jq

          echo "Installing AWS CLI v2..."

          curl -fsSL \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o /tmp/awscliv2.zip

          unzip -q /tmp/awscliv2.zip -d /tmp

          sudo /tmp/aws/install --update

          echo ""
          echo "AWS CLI:"
          aws --version

          echo ""
          echo "jq:"
          jq --version

      # ==========================================================
      # 4. SHOW CONFIGURATION
      # ==========================================================
      - name: Show Configuration
        run: |
          echo "=========================================="
          echo "EDGE + STORAGE MIGRATION"
          echo "=========================================="
          echo "SOURCE : $SOURCE_PROJECT_REF"
          echo "TARGET : $TARGET_PROJECT_REF"
          echo "=========================================="

      # ==========================================================
      # 5. LOGIN SOURCE
      # ==========================================================
      - name: Login to SOURCE
        env:
          SOURCE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SOURCE_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          if [ -z "$SOURCE_SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SOURCE_SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          supabase login \
            --token "$SOURCE_SUPABASE_ACCESS_TOKEN"

          echo "SOURCE login successful."

      # ==========================================================
      # 6. LOGIN TARGET
      # ==========================================================
      - name: Login to TARGET
        env:
          TARGET_SUPABASE_ACCESS_TOKEN: ${{ secrets.TARGET_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          if [ -z "$TARGET_SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: TARGET_SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          supabase login \
            --token "$TARGET_SUPABASE_ACCESS_TOKEN"

          echo "TARGET login successful."

      # ==========================================================
      # 7. CHECK EDGE FUNCTIONS
      # ==========================================================
      - name: Check Edge Functions
        run: |
          set -e

          echo "=========================================="
          echo "EDGE FUNCTIONS IN REPOSITORY"
          echo "=========================================="

          if [ ! -d "supabase/functions" ]; then
            echo "ERROR: supabase/functions directory not found."
            exit 1
          fi

          found=false

          for dir in supabase/functions/*/; do

            if [ ! -d "$dir" ]; then
              continue
            fi

            function_name=$(basename "$dir")

            if [ "$function_name" = "_shared" ]; then
              echo "Skipping _shared"
              continue
            fi

            found=true

            echo "Found function: $function_name"

          done

          if [ "$found" = false ]; then
            echo "No Edge Functions found."
          fi

      # ==========================================================
      # 8. DEPLOY EDGE FUNCTIONS
      # ==========================================================
      - name: Deploy Edge Functions to TARGET
        run: |
          set -e

          echo "=========================================="
          echo "DEPLOYING EDGE FUNCTIONS"
          echo "=========================================="

          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory."
            exit 0
          fi

          found=false

          for dir in supabase/functions/*/; do

            if [ ! -d "$dir" ]; then
              continue
            fi

            function_name=$(basename "$dir")

            if [ "$function_name" = "_shared" ]; then
              echo "Skipping _shared"
              continue
            fi

            found=true

            echo ""
            echo "------------------------------------------"
            echo "Deploying: $function_name"
            echo "------------------------------------------"

            supabase functions deploy "$function_name" \
              --project-ref "$TARGET_PROJECT_REF"

            echo "SUCCESS: $function_name"

          done

          if [ "$found" = false ]; then
            echo "No Edge Functions found."
          fi

      # ==========================================================
      # 9. VERIFY EDGE FUNCTIONS
      # ==========================================================
      - name: Verify Edge Functions
        run: |
          set -e

          echo "=========================================="
          echo "TARGET EDGE FUNCTIONS"
          echo "=========================================="

          supabase functions list \
            --project-ref "$TARGET_PROJECT_REF"

      # ==========================================================
      # 10. CONFIGURE SOURCE STORAGE
      # ==========================================================
      - name: Configure SOURCE Storage
        env:
          SOURCE_STORAGE_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY }}
          SOURCE_STORAGE_SECRET_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_KEY }}
          SOURCE_STORAGE_REGION: ${{ secrets.SOURCE_STORAGE_REGION }}
        run: |
          set -e

          if [ -z "$SOURCE_STORAGE_ACCESS_KEY" ]; then
            echo "ERROR: SOURCE_STORAGE_ACCESS_KEY is missing."
            exit 1
          fi

          if [ -z "$SOURCE_STORAGE_SECRET_KEY" ]; then
            echo "ERROR: SOURCE_STORAGE_SECRET_KEY is missing."
            exit 1
          fi

          if [ -z "$SOURCE_STORAGE_REGION" ]; then
            echo "ERROR: SOURCE_STORAGE_REGION is missing."
            exit 1
          fi

          echo "SOURCE_STORAGE_ENDPOINT=https://${SOURCE_PROJECT_REF}.storage.supabase.co/storage/v1/s3" >> "$GITHUB_ENV"
          echo "SOURCE_STORAGE_REGION=$SOURCE_STORAGE_REGION" >> "$GITHUB_ENV"

          echo "SOURCE Storage configured."

      # ==========================================================
      # 11. CONFIGURE TARGET STORAGE
      # ==========================================================
      - name: Configure TARGET Storage
        env:
          TARGET_STORAGE_ACCESS_KEY: ${{ secrets.TARGET_STORAGE_ACCESS_KEY }}
          TARGET_STORAGE_SECRET_KEY: ${{ secrets.TARGET_STORAGE_SECRET_KEY }}
          TARGET_STORAGE_REGION: ${{ secrets.TARGET_STORAGE_REGION }}
        run: |
          set -e

          if [ -z "$TARGET_STORAGE_ACCESS_KEY" ]; then
            echo "ERROR: TARGET_STORAGE_ACCESS_KEY is missing."
            exit 1
          fi

          if [ -z "$TARGET_STORAGE_SECRET_KEY" ]; then
            echo "ERROR: TARGET_STORAGE_SECRET_KEY is missing."
            exit 1
          fi

          if [ -z "$TARGET_STORAGE_REGION" ]; then
            echo "ERROR: TARGET_STORAGE_REGION is missing."
            exit 1
          fi

          echo "TARGET_STORAGE_ENDPOINT=https://${TARGET_PROJECT_REF}.storage.supabase.co/storage/v1/s3" >> "$GITHUB_ENV"
          echo "TARGET_STORAGE_REGION=$TARGET_STORAGE_REGION" >> "$GITHUB_ENV"

          echo "TARGET Storage configured."

      # ==========================================================
      # 12. TEST SOURCE S3 CONNECTION
      # ==========================================================
      - name: Test SOURCE Storage
        env:
          SOURCE_STORAGE_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY }}
          SOURCE_STORAGE_SECRET_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "TESTING SOURCE STORAGE"
          echo "=========================================="

          AWS_ACCESS_KEY_ID="$SOURCE_STORAGE_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$SOURCE_STORAGE_SECRET_KEY" \
          aws s3 ls \
            --endpoint-url "$SOURCE_STORAGE_ENDPOINT" \
            --region "$SOURCE_STORAGE_REGION"

          echo "SOURCE Storage connection successful."

      # ==========================================================
      # 13. TEST TARGET S3 CONNECTION
      # ==========================================================
      - name: Test TARGET Storage
        env:
          TARGET_STORAGE_ACCESS_KEY: ${{ secrets.TARGET_STORAGE_ACCESS_KEY }}
          TARGET_STORAGE_SECRET_KEY: ${{ secrets.TARGET_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "TESTING TARGET STORAGE"
          echo "=========================================="

          AWS_ACCESS_KEY_ID="$TARGET_STORAGE_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$TARGET_STORAGE_SECRET_KEY" \
          aws s3 ls \
            --endpoint-url "$TARGET_STORAGE_ENDPOINT" \
            --region "$TARGET_STORAGE_REGION"

          echo "TARGET Storage connection successful."

      # ==========================================================
      # 14. LIST SOURCE BUCKETS
      # ==========================================================
      - name: List SOURCE Buckets
        env:
          SOURCE_STORAGE_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY }}
          SOURCE_STORAGE_SECRET_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "SOURCE STORAGE BUCKETS"
          echo "=========================================="

          AWS_ACCESS_KEY_ID="$SOURCE_STORAGE_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$SOURCE_STORAGE_SECRET_KEY" \
          aws s3api list-buckets \
            --endpoint-url "$SOURCE_STORAGE_ENDPOINT" \
            --region "$SOURCE_STORAGE_REGION" \
            --query 'Buckets[].Name' \
            --output text \
            | tr '\t' '\n' \
            | sort \
            > source_buckets.txt

          if [ ! -s source_buckets.txt ]; then
            echo "No Storage buckets found."
            exit 0
          fi

          cat source_buckets.txt

      # ==========================================================
      # 15. CREATE TARGET BUCKETS
      # ==========================================================
      - name: Create TARGET Buckets
        env:
          TARGET_STORAGE_ACCESS_KEY: ${{ secrets.TARGET_STORAGE_ACCESS_KEY }}
          TARGET_STORAGE_SECRET_KEY: ${{ secrets.TARGET_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "CREATING TARGET STORAGE BUCKETS"
          echo "=========================================="

          if [ ! -s source_buckets.txt ]; then
            echo "No buckets to create."
            exit 0
          fi

          while IFS= read -r bucket
          do

            if [ -z "$bucket" ]; then
              continue
            fi

            echo ""
            echo "Creating bucket: $bucket"

            AWS_ACCESS_KEY_ID="$TARGET_STORAGE_ACCESS_KEY" \
            AWS_SECRET_ACCESS_KEY="$TARGET_STORAGE_SECRET_KEY" \
            aws s3 mb \
              "s3://$bucket" \
              --endpoint-url "$TARGET_STORAGE_ENDPOINT" \
              --region "$TARGET_STORAGE_REGION" \
              2>/dev/null || true

          done < source_buckets.txt

          echo ""
          echo "Target bucket creation completed."

      # ==========================================================
      # 16. COPY STORAGE OBJECTS
      #
      # Source:
      #   Supabase Storage
      #
      # Temporary GitHub runner:
      #   storage-migration/
      #
      # Target:
      #   Supabase Storage
      # ==========================================================
      - name: Copy Storage Objects
        env:
          SOURCE_STORAGE_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY }}
          SOURCE_STORAGE_SECRET_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_KEY }}
          TARGET_STORAGE_ACCESS_KEY: ${{ secrets.TARGET_STORAGE_ACCESS_KEY }}
          TARGET_STORAGE_SECRET_KEY: ${{ secrets.TARGET_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "COPYING STORAGE OBJECTS"
          echo "=========================================="

          if [ ! -s source_buckets.txt ]; then
            echo "No buckets found."
            exit 0
          fi

          rm -rf storage-migration
          mkdir -p storage-migration

          while IFS= read -r bucket
          do

            if [ -z "$bucket" ]; then
              continue
            fi

            echo ""
            echo "=========================================="
            echo "BUCKET: $bucket"
            echo "=========================================="

            mkdir -p "storage-migration/$bucket"

            echo "Downloading from SOURCE..."

            AWS_ACCESS_KEY_ID="$SOURCE_STORAGE_ACCESS_KEY" \
            AWS_SECRET_ACCESS_KEY="$SOURCE_STORAGE_SECRET_KEY" \
            aws s3 sync \
              "s3://$bucket" \
              "storage-migration/$bucket" \
              --endpoint-url "$SOURCE_STORAGE_ENDPOINT" \
              --region "$SOURCE_STORAGE_REGION" \
              --no-progress

            echo "Uploading to TARGET..."

            AWS_ACCESS_KEY_ID="$TARGET_STORAGE_ACCESS_KEY" \
            AWS_SECRET_ACCESS_KEY="$TARGET_STORAGE_SECRET_KEY" \
            aws s3 sync \
              "storage-migration/$bucket" \
              "s3://$bucket" \
              --endpoint-url "$TARGET_STORAGE_ENDPOINT" \
              --region "$TARGET_STORAGE_REGION" \
              --no-progress

            echo "Bucket completed: $bucket"

          done < source_buckets.txt

      # ==========================================================
      # 17. VERIFY TARGET BUCKETS
      # ==========================================================
      - name: Verify TARGET Buckets
        env:
          TARGET_STORAGE_ACCESS_KEY: ${{ secrets.TARGET_STORAGE_ACCESS_KEY }}
          TARGET_STORAGE_SECRET_KEY: ${{ secrets.TARGET_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "TARGET BUCKETS"
          echo "=========================================="

          AWS_ACCESS_KEY_ID="$TARGET_STORAGE_ACCESS_KEY" \
          AWS_SECRET_ACCESS_KEY="$TARGET_STORAGE_SECRET_KEY" \
          aws s3 ls \
            --endpoint-url "$TARGET_STORAGE_ENDPOINT" \
            --region "$TARGET_STORAGE_REGION"

      # ==========================================================
      # 18. VERIFY OBJECT COUNTS
      # ==========================================================
      - name: Verify Storage Objects
        env:
          SOURCE_STORAGE_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY }}
          SOURCE_STORAGE_SECRET_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_KEY }}
          TARGET_STORAGE_ACCESS_KEY: ${{ secrets.TARGET_STORAGE_ACCESS_KEY }}
          TARGET_STORAGE_SECRET_KEY: ${{ secrets.TARGET_STORAGE_SECRET_KEY }}
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING STORAGE OBJECT COUNTS"
          echo "=========================================="

          if [ ! -s source_buckets.txt ]; then
            echo "No buckets found."
            exit 0
          fi

          while IFS= read -r bucket
          do

            if [ -z "$bucket" ]; then
              continue
            fi

            SOURCE_COUNT=$(
              AWS_ACCESS_KEY_ID="$SOURCE_STORAGE_ACCESS_KEY" \
              AWS_SECRET_ACCESS_KEY="$SOURCE_STORAGE_SECRET_KEY" \
              aws s3 ls \
                "s3://$bucket" \
                --recursive \
                --endpoint-url "$SOURCE_STORAGE_ENDPOINT" \
                --region "$SOURCE_STORAGE_REGION" \
                | wc -l
            )

            TARGET_COUNT=$(
              AWS_ACCESS_KEY_ID="$TARGET_STORAGE_ACCESS_KEY" \
              AWS_SECRET_ACCESS_KEY="$TARGET_STORAGE_SECRET_KEY" \
              aws s3 ls \
                "s3://$bucket" \
                --recursive \
                --endpoint-url "$TARGET_STORAGE_ENDPOINT" \
                --region "$TARGET_STORAGE_REGION" \
                | wc -l
            )

            echo ""
            echo "Bucket: $bucket"
            echo "SOURCE objects: $SOURCE_COUNT"
            echo "TARGET objects: $TARGET_COUNT"

            if [ "$SOURCE_COUNT" -ne "$TARGET_COUNT" ]; then
              echo "WARNING: Object count mismatch."
            else
              echo "OK: Object counts match."
            fi

          done < source_buckets.txt

      # ==========================================================
      # 19. FINAL SUMMARY
      # ==========================================================
      - name: Migration Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "EDGE + STORAGE MIGRATION SUMMARY"
          echo "=========================================="
          echo ""
          echo "SOURCE:"
          echo "$SOURCE_PROJECT_REF"
          echo ""
          echo "TARGET:"
          echo "$TARGET_PROJECT_REF"
          echo ""
          echo "Completed:"
          echo "  Edge Function deployment"
          echo "  Storage bucket creation"
          echo "  Storage object copy"
          echo "  Storage object verification"
          echo ""
          echo "IMPORTANT:"
          echo "Edge Function secrets are NOT copied automatically."
          echo "Configure them separately using Supabase secrets."
          echo ""
          echo "=========================================="

      # ==========================================================
      # 20. CLEANUP
      # ==========================================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf storage-migration
          rm -f source_buckets.txt

          echo "Cleanup completed."
